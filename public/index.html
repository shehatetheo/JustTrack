<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A calorie tracker with no account and no ads. Snap your food, know your calories. Try the real app right here in the page." />
    <!-- How a link to the site looks when it is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JustTrack" />
    <meta property="og:description" content="A calorie tracker with no account and no ads. Snap your food, know your calories." />
    <meta property="og:image" content="https://justtrack-snowy.vercel.app/demo/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://justtrack-snowy.vercel.app/demo/og.jpg" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* The app opens on black; the page is black before it loads, so there is no white flash. */
        background-color: #0a0a0b;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
